#ddev-generated
# Details about the install.yaml file are at https://ddev.readthedocs.io/en/stable/users/extend/additional-services/#sections-and-features-of-ddev-get-add-on-installyaml

name: ddev-playwright

# pre_install_actions - list of actions to run before installing the addon.
# Examples would be removing an extraneous docker volume,
# or doing a sanity check for requirements.
# DDEV environment variables can be interpolated into these actions
# pre_install_actions are executed in the context of the target project's root directory.
pre_install_actions:
  - |
    #ddev-description:Check if the addon is compatible with this DDEV version
    if ! ( ddev version | grep -E "v1\.(2[1-9]|[3-9][0-9])" >/dev/null 2>&1 ) ; then
      echo "This add-on requires DDEV v1.21+ or higher, please upgrade." && exit 2
    fi

  # Show prompt for PLAYWRIGHT_VERSION only if not already set in project config
  - |
    #ddev-nodisplay
    if ( {{ contains "PLAYWRIGHT_VERSION=" (list .DdevProjectConfig.web_environment | toString) }} ); then
      echo "Using existing PLAYWRIGHT_VERSION from project config."
    else
      printf "\nPlaywright version configuration\nSee releases: https://github.com/microsoft/playwright/releases\n\nEnter Playwright version [latest]: "
    fi

  # Read user input and persist PLAYWRIGHT_VERSION into the project's config.yaml
  - |
    #ddev-nodisplay
    #ddev-description:Configure Playwright version
    if !( {{ contains "PLAYWRIGHT_VERSION=" (list .DdevProjectConfig.web_environment | toString) }} ); then
      if [ -n "${DDEV_NONINTERACTIVE:-}" ] || [ ! -t 0 ]; then
        PW_VERSION="latest"
        echo "Non-interactive mode, using: ${PW_VERSION}"
      else
        read -r PW_VERSION
        PW_VERSION="${PW_VERSION:-latest}"
      fi
      echo "Setting Playwright version to: ${PW_VERSION}"
      ddev config --web-environment-add "PLAYWRIGHT_VERSION=${PW_VERSION}"
    fi

# list of files and directories listed that are copied into project .ddev directory
# Each file should contain #ddev-generated so it can be replaced by a later `ddev add-on get`
# if it hasn't been modified by the user.
# DDEV environment variables can be interpolated into these filenames
# If you use directories, they must be directories that are managed
# by this add-on, or removal could remove things that are not owned by it
project_files:
  - config.playwright.yaml
  - commands/web/playwright
  - commands/web/install-playwright
  - commands/web/reinstall-browsers
  - web-build/Dockerfile.playwright
  - pw-examples

# List of files and directories that are copied into the global .ddev directory
# DDEV environment variables can be interpolated into these filenames
# Note that if these files are used by a team, you will need to automate their installation
# by adding `ddev add-on get` to your workflow to ensure that everyone has them.
# Otherwise, use 'project_files' to commit them to the repository.
global_files:
  # - commands/web/add-on-command
  # - homeadditions/some-file.txt

# Version constraint for DDEV that will be validated against the running DDEV executable
# and prevent add-on from being installed if it doesn't validate.
# See https://github.com/Masterminds/semver#checking-version-constraints for constraint rules.
# Available with DDEV v1.23.4+, and works only for DDEV v1.23.4+ binaries
# example: ddev_version_constraint: '>= v1.23.4'
ddev_version_constraint: ''

# List of add-on names that this add-on depends on
dependencies:
  - ddev/ddev-nvm

# DDEV environment variables can be interpolated into these actions.
# post_install_actions are executed in the context of the target project's .ddev directory.
post_install_actions:
  - chmod +x commands/web/playwright
  - chmod +x commands/web/install-playwright
  - chmod +x commands/web/reinstall-browsers
  - |
    #ddev-description:Add Playwright version to Docker build args
    # Read the version saved during pre_install into the project's web_build_args
    PW_VERSION=$(grep -E "^\s*- PLAYWRIGHT_VERSION=" config.yaml 2>/dev/null | sed 's/.*PLAYWRIGHT_VERSION=//' | head -1)
    PW_VERSION="${PW_VERSION:-latest}"
    # Append web_build_args to config.playwright.yaml so Docker uses the right version
    if ! grep -q "web_build_args" config.playwright.yaml; then
      printf "\nweb_build_args:\n  PLAYWRIGHT_VERSION: \"%s\"\n" "${PW_VERSION}" >> config.playwright.yaml
    fi
    echo "Playwright Docker build arg set to: ${PW_VERSION}"
  - |
    #ddev-description:Setup Playwright test environment
    echo "Setting up Playwright test environment..."

    # Use PLAYWRIGHT_TEST_DIR environment variable, default to "tests"
    TEST_DIR="${PLAYWRIGHT_TEST_DIR:-tests}"

    # Create ${TEST_DIR}/playwright directory and default .nvmrc if needed
    if [ ! -d "${DDEV_APPROOT}/${TEST_DIR}/playwright" ]; then
      mkdir -p "${DDEV_APPROOT}/${TEST_DIR}/playwright"
      echo "22" > "${DDEV_APPROOT}/${TEST_DIR}/playwright/.nvmrc"
      echo "Created ${DDEV_APPROOT}/${TEST_DIR}/playwright/ with .nvmrc (Node 22)"
    fi
  - |
    #ddev-description:Prepare Playwright configuration for DDEV
    echo "Preparing Playwright configuration for DDEV..."

    TEST_DIR="${PLAYWRIGHT_TEST_DIR:-tests}"
    mkdir -p "${DDEV_APPROOT}/${TEST_DIR}/playwright/tests"
    [ ! -f "${DDEV_APPROOT}/${TEST_DIR}/playwright/.nvmrc" ] && echo "22" > "${DDEV_APPROOT}/${TEST_DIR}/playwright/.nvmrc"
    cp pw-examples/global-setup.ts "${DDEV_APPROOT}/${TEST_DIR}/playwright/tests/global-setup.ts"
    cp pw-examples/global-teardown.ts "${DDEV_APPROOT}/${TEST_DIR}/playwright/tests/global-teardown.ts"
    echo "Prepared tests/ directory with global setup and teardown; .nvmrc set to 22"
  - |
    #ddev-description:Provide instructions after installation
    echo "Playwright addon has been installed and configured!"
    echo ""
    echo "Next steps:"
    echo "  1. ddev restart   # Rebuild web container with Playwright support"
    echo "  2. ddev install-playwright   # Init Playwright (version from config) and install browsers"
    echo "  3. ddev playwright test      # Run tests (or: ddev playwright --help)"
    echo ""
    echo "Optional: ddev reinstall-browsers   # Reinstall browser binaries"
    echo "          ddev playwright show-report --host=0.0.0.0   # Then visit http://${DDEV_HOSTNAME}:9323"
    echo ""
    echo "Your Playwright environment is ready after steps 1–2."

# Shell actions that can be done during removal of the add-on.
# Files listed in project_files section will be automatically removed here if they contain #ddev-generated line.
# removal_actions are executed in the context of the target project's .ddev directory.
removal_actions:
  - |
    #ddev-description:Clean up Playwright installation
    echo "Playwright addon has been removed."
    echo "Note: Playwright binaries remain installed in the web container."
    echo "To completely remove Playwright, you may need to rebuild your web container."
    rm -rf .ddev/pw-examples

# Advanced usage - YAML files can be read in and then used as go template actions
# in pre_install_actions and post_install_actions
# See example in
# https://github.com/ddev/ddev/blob/master/cmd/ddev/cmd/testdata/TestCmdAddonComplex/recipe/install.yaml
yaml_read_files:
  # someyaml: someyaml.yaml
  # otheryaml: someotheryaml.yaml
